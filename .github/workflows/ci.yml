# Live CI for the factory repository. Pull requests receive targeted/policy
# proof; protected main receives complete Linux and macOS proof.
# Managed local verification: bash ci/test-all.sh --changed-or-defer origin/main HEAD
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      behavioral: ${{ steps.classify.outputs.behavioral }}
      base: ${{ steps.classify.outputs.base }}
      groups: ${{ steps.classify.outputs.groups }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: classify complete diff
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
          if test "$GITHUB_EVENT_NAME" = push; then
            echo "behavioral=true" >> "$GITHUB_OUTPUT"
            echo 'groups=[1,2,3,4]' >> "$GITHUB_OUTPUT"
          elif bash ci/lightweight-change.sh "$BASE_SHA" "$GITHUB_SHA"; then
            echo "behavioral=false" >> "$GITHUB_OUTPUT"
            echo 'groups=["pr"]' >> "$GITHUB_OUTPUT"
          else
            echo "behavioral=true" >> "$GITHUB_OUTPUT"
            echo 'groups=["pr"]' >> "$GITHUB_OUTPUT"
          fi

  linux:
    name: linux-group-${{ matrix.group }}
    needs: scope
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.scope.outputs.groups) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        if: needs.scope.outputs.behavioral == 'true'
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-python@v6
        if: needs.scope.outputs.behavioral == 'true'
        with:
          python-version: "3.12"
      - name: repository baseline
        run: scripts/repo-check
      - name: secret scan
        run: scripts/secret-scan
      - name: artifact policy
        env:
          BASE_SHA: ${{ needs.scope.outputs.base }}
        run: scripts/artifact-check --base "$BASE_SHA"
      - name: targeted or deferred pull-request verification
        if: github.event_name == 'pull_request' && needs.scope.outputs.behavioral == 'true'
        env:
          BASE_SHA: ${{ needs.scope.outputs.base }}
        run: CI_SUMMARY_FILE="$GITHUB_STEP_SUMMARY" bash ci/test-all.sh --changed-or-defer "$BASE_SHA" "$GITHUB_SHA"
      - name: complete main verification
        if: github.event_name == 'push'
        env:
          BASE_REF: origin/main
          CI_FORCE_FULL: "1"
        run: CI_SUMMARY_FILE="$GITHUB_STEP_SUMMARY" bash ci/test-all.sh --group "${{ matrix.group }}"

  macos-bash-3:
    name: macos-bash-3-group-${{ matrix.group }}
    needs: scope
    if: needs.scope.outputs.behavioral == 'true'
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.scope.outputs.groups) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: install GNU timeout
        env:
          HOMEBREW_ALLOWED_TAPS: homebrew/core
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          if ! command -v timeout >/dev/null 2>&1; then
            if ! brew install --formula coreutils >"$RUNNER_TEMP/brew-coreutils.log" 2>&1; then
              cat "$RUNNER_TEMP/brew-coreutils.log"
              exit 1
            fi
          fi
      - name: targeted or deferred pull-request verification under system Bash
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ needs.scope.outputs.base }}
        run: CI_SUMMARY_FILE="$GITHUB_STEP_SUMMARY" /bin/bash ci/test-all.sh --changed-or-defer "$BASE_SHA" "$GITHUB_SHA"
      - name: complete main suite under system Bash
        if: github.event_name == 'push'
        env:
          CI_FORCE_FULL: "1"
        run: CI_SUMMARY_FILE="$GITHUB_STEP_SUMMARY" /bin/bash ci/test-all.sh --group "${{ matrix.group }}"

  # Preserve the installed release-evidence contexts while the implementation
  # fans out to four balanced hosted runners per platform.
  linux-shard-evidence:
    name: linux-${{ matrix.shard }}
    if: always() && github.event_name == 'push'
    needs: [scope, linux]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [factory, hermes, release]
    steps:
      - name: require all Linux groups
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          GROUP_RESULT: ${{ needs.linux.result }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$GROUP_RESULT" = success

  macos-shard-evidence:
    name: macos-bash-3-${{ matrix.shard }}
    if: always() && github.event_name == 'push'
    needs: [scope, macos-bash-3]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [factory, hermes, release]
    steps:
      - name: require all macOS groups
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          GROUP_RESULT: ${{ needs.macos-bash-3.result }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$GROUP_RESULT" = success

  # Keep the required context stable while all eight platform groups execute.
  ci:
    if: always()
    needs: [scope, linux, macos-bash-3]
    runs-on: ubuntu-latest
    steps:
      - name: require applicable verification
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          BEHAVIORAL: ${{ needs.scope.outputs.behavioral }}
          LINUX_RESULT: ${{ needs.linux.result }}
          MACOS_RESULT: ${{ needs.macos-bash-3.result }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$LINUX_RESULT" = success
          if test "$BEHAVIORAL" = false; then
            test "$MACOS_RESULT" = skipped
          else
            test "$MACOS_RESULT" = success
          fi

  test-immutability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: builder commits must not touch tests
        run: bash ci/test-immutability-check.sh
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
          TEST_PATHS: conformance/app/tests/
