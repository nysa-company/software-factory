# Live CI for the factory repository. Pull requests use fail-closed dynamic
# selection; protected main always receives complete Linux and macOS proof.
# Managed local verification: bash ci/test-all.sh --changed-or-defer origin/main HEAD
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      behavioral: ${{ steps.classify.outputs.behavioral }}
      macos: ${{ steps.classify.outputs.macos }}
      base: ${{ steps.classify.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: classify complete diff
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
          if test "$GITHUB_EVENT_NAME" = push; then
            echo "behavioral=true" >> "$GITHUB_OUTPUT"
            echo "macos=true" >> "$GITHUB_OUTPUT"
          elif bash ci/lightweight-change.sh "$BASE_SHA" "$GITHUB_SHA"; then
            echo "behavioral=false" >> "$GITHUB_OUTPUT"
            echo "macos=false" >> "$GITHUB_OUTPUT"
          else
            echo "behavioral=true" >> "$GITHUB_OUTPUT"
            if bash ci/macos-required-change.sh "$BASE_SHA" "$GITHUB_SHA"; then
              echo "macos=true" >> "$GITHUB_OUTPUT"
            else
              echo "macos=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  linux:
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: needs.scope.outputs.behavioral == 'true'
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        if: needs.scope.outputs.behavioral == 'true'
        with:
          python-version: "3.12"
      - name: repository baseline
        run: scripts/repo-check
      - name: secret scan
        run: scripts/secret-scan
      - name: artifact policy
        env:
          BASE_SHA: ${{ needs.scope.outputs.base }}
        run: scripts/artifact-check --base "$BASE_SHA"
      - name: selected pull-request verification
        if: github.event_name == 'pull_request' && needs.scope.outputs.behavioral == 'true'
        env:
          BASE_REF: origin/main
          BASE_SHA: ${{ needs.scope.outputs.base }}
          CI_FORCE_FULL: ${{ vars.CI_FORCE_FULL || '0' }}
        run: >-
          CI_SUMMARY_FILE="$GITHUB_STEP_SUMMARY"
          bash ci/test-all.sh --changed "$BASE_SHA" "$GITHUB_SHA"
      - name: complete main verification
        if: github.event_name == 'push'
        env:
          BASE_REF: origin/main
          CI_FORCE_FULL: "1"
        run: CI_SUMMARY_FILE="$GITHUB_STEP_SUMMARY" bash ci/test-all.sh

  macos-bash-3:
    needs: scope
    if: >-
      needs.scope.outputs.behavioral == 'true' &&
      (github.event_name == 'push' || needs.scope.outputs.macos == 'true')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install GNU timeout
        run: brew install coreutils
      - name: selected pull-request verification under system Bash
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/main
          BASE_SHA: ${{ needs.scope.outputs.base }}
          CI_FORCE_FULL: ${{ vars.CI_FORCE_FULL || '0' }}
        run: >-
          CI_SUMMARY_FILE="$GITHUB_STEP_SUMMARY"
          /bin/bash ci/test-all.sh --changed "$BASE_SHA" "$GITHUB_SHA"
      - name: complete main suite under system Bash
        if: github.event_name == 'push'
        env:
          CI_FORCE_FULL: "1"
        run: CI_SUMMARY_FILE="$GITHUB_STEP_SUMMARY" /bin/bash ci/test-all.sh

  # Keep the required context stable while Linux and macOS execute in parallel.
  ci:
    if: always()
    needs: [scope, linux, macos-bash-3]
    runs-on: ubuntu-latest
    steps:
      - name: require applicable verification
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          BEHAVIORAL: ${{ needs.scope.outputs.behavioral }}
          LINUX_RESULT: ${{ needs.linux.result }}
          MACOS_REQUIRED: ${{ needs.scope.outputs.macos }}
          MACOS_RESULT: ${{ needs.macos-bash-3.result }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$LINUX_RESULT" = success
          if test "$BEHAVIORAL" = false; then
            test "$MACOS_REQUIRED" = false
            test "$MACOS_RESULT" = skipped
          elif test "$EVENT_NAME" = push || test "$MACOS_REQUIRED" = true; then
            test "$MACOS_RESULT" = success
          else
            test "$MACOS_RESULT" = skipped
          fi

  test-immutability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: builder commits must not touch tests
        run: bash ci/test-immutability-check.sh
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
          TEST_PATHS: conformance/app/tests/
