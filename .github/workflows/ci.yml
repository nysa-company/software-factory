# Live CI for this repo, instantiated from ci/github-actions-ci.template.yml.
# The "product" here is the Relay conformance app; when the kit is
# instantiated for a real product, that repo gets its own copy.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: repository baseline
        run: scripts/repo-check
      - name: secret history and working tree
        run: scripts/secret-scan
      - name: secret scanner regression
        run: bash ci/secret-scan-test.sh
      - name: adapter permission policies
        run: bash ci/adapter-policy-test.sh
      - name: tests
        run: npm test
        working-directory: conformance/app
      - name: factory script regressions
        run: bash ci/test-factory-scripts.sh
      - name: Linear reconciler regressions
        run: python3 ci/linear-sync-test.py
      - name: reorder-test-fixes suite
        run: bash ci/reorder-test-fixes-test.sh
      - name: preflight suite
        run: bash ci/preflight-test.sh

  macos-bash-3:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install GNU timeout
        run: brew install coreutils
      - name: full suite under system Bash
        run: /bin/bash ci/test-all.sh

  test-immutability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the check walks every commit on the branch
      - name: builder commits must not touch tests
        run: bash ci/test-immutability-check.sh
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
          TEST_PATHS: conformance/app/tests/
